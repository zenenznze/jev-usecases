<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>远航汽车 · 销售副驾驶挑战台</title>
  <style>
    :root { --ink:#172335; --muted:#697789; --line:#dce4ec; --bg:#f3f6f9; --panel:#fff; --blue:#2167b1; --purple:#6b4bb6; --amber:#a15d00; --red:#a42e35; --green:#237344; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Microsoft YaHei", sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--bg); }
    .topbar { display:flex; justify-content:space-between; gap:28px; align-items:flex-end; padding:28px max(24px, calc((100% - 1440px)/2)); color:#fff; background:linear-gradient(120deg,#102946,#1e4972); }
    .topbar h1 { margin:5px 0 8px; font-size:clamp(25px,3vw,38px); letter-spacing:-.03em; }
    .topbar p { margin:0; max-width:800px; color:#dbeafe; font-size:15px; }
    .eyebrow { color:#8bd1ff; font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
    .top-actions { display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end; gap:8px; min-width:270px; }
    select, textarea, button { font:inherit; border-radius:8px; border:1px solid #bdc9d6; }
    select { padding:10px 12px; background:#fff; color:var(--ink); }
    textarea { width:100%; min-height:132px; padding:13px; line-height:1.65; resize:vertical; background:#fbfdff; color:var(--ink); }
    button { cursor:pointer; padding:10px 15px; color:#fff; background:var(--blue); border-color:var(--blue); font-weight:700; }
    button:hover:not(:disabled) { filter:brightness(.95); transform:translateY(-1px); }
    button:disabled { cursor:not-allowed; opacity:.45; }
    button.secondary { color:var(--blue); background:#fff; }
    .mode-pill, .badge, .chip { display:inline-flex; align-items:center; border-radius:999px; font-size:12px; font-weight:800; }
    .mode-pill { padding:9px 12px; color:#fff; letter-spacing:.04em; }
    .mode-pill.replay { background:#536579; }.mode-pill.live { background:#a52d39; }
    .notice, .success, .error { max-width:1440px; margin:16px auto 0; padding:12px 16px; border-radius:10px; }
    .notice { color:#475569; border:1px solid #d6e0eb; background:#eaf2f9; }.success { color:#185d37; border:1px solid #b9e0c5; background:#effbf2; }.error { color:#8d2630; border:1px solid #efb8bd; background:#fff0f1; }
    .workbench { display:grid; grid-template-columns:repeat(12,1fr); gap:16px; max-width:1440px; margin:16px auto 44px; padding:0 24px; }
    .panel { grid-column:span 6; min-width:0; padding:19px; border:1px solid var(--line); border-radius:14px; background:var(--panel); box-shadow:0 5px 22px rgba(27,55,85,.05); }
    .customer-panel,.assistant-panel { grid-column:span 6; }.approval-panel,.crm-panel { grid-column:span 6; }.audit-panel { grid-column:span 12; }
    .panel-title { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:15px; }.panel-title h2,.panel-title h3 { margin:0; }.panel-title h2 { font-size:18px; }.panel-title h3 { font-size:15px; }.panel-title.sub { margin-top:20px; padding-top:15px; border-top:1px solid var(--line); }
    .badge { padding:5px 9px; }.badge.blue { color:#1c5c9e; background:#e5f1ff; }.badge.purple { color:#5e3ca8; background:#eeeaff; }.badge.amber { color:#945500; background:#fff1d7; }.badge.green { color:#216b3d; background:#e4f7ea; }.badge.gray { color:#5e6d7d; background:#eef2f6; }.badge.red { color:#9e2733; background:#ffe3e5; }
    .case-label { display:grid; gap:6px; margin-bottom:12px; font-size:13px; color:var(--muted); }.case-label select { width:100%; }
    .button-row { display:flex; align-items:center; gap:12px; margin-top:11px; }.muted,.empty { color:var(--muted); font-size:13px; }.empty { padding:17px 0; }
    .section-label { margin:18px 0 8px; color:#334155; font-weight:800; font-size:13px; }.unknown-label { color:#9a4e0b; }
    .fact-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }.fact { display:grid; gap:3px; padding:9px; border-radius:8px; background:#f7fafc; border:1px solid #e6edf3; }.fact span,.crm-readback span,.telemetry span { color:var(--muted); font-size:11px; }.fact strong { font-size:13px; }.fact em { color:#3d7655; font-size:11px; font-style:normal; }
    .chips { display:flex; flex-wrap:wrap; gap:7px; }.chip { padding:5px 8px; color:#8b4a08; background:#fff5e6; border:1px solid #f5d7a5; }
    .telemetry { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; margin-bottom:14px; }.telemetry div { display:grid; gap:4px; padding:9px; background:#f7fafc; border:1px solid #e5ebf1; border-radius:8px; min-width:0; }.telemetry strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }.live-text { color:var(--red); }.replay-text { color:#536579; }
    .answer-list { display:grid; gap:6px; }.answer-row { display:grid; grid-template-columns:1.1fr 1fr 1.1fr; align-items:center; gap:8px; padding:10px 11px; border:1px solid #e4eaf0; border-radius:8px; }.answer-row.risk { border-color:#f1caca; background:#fff8f8; }.answer-row span { color:#4b5a69; font-size:13px; }.answer-row strong { font-size:14px; }.answer-row small { color:var(--muted); text-align:right; }
    .proposal { padding:13px; border-radius:10px; border:1px solid #e3e9ef; background:#fbfdff; }.proposal.blocked { border-color:#edbfc4; background:#fff7f7; }.proposal-head { display:flex; align-items:center; gap:10px; }.proposal-head strong { font-size:17px; }.proposal p { color:#465567; line-height:1.55; }.policy-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin:10px 0; }.policy-grid span { padding:8px; border-radius:7px; background:#f1f5f9; font-size:11px; }.policy-grid b { display:block; margin-top:3px; font-size:14px; }.proposal small { color:var(--muted); word-break:break-all; }.actions { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
    .approval-rules { display:grid; gap:9px; padding:13px; margin-bottom:14px; color:#44566a; background:#f7fafc; border-radius:10px; font-size:13px; }.approval-rules div::first-letter { color:var(--green); }
    .crm-readback { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-bottom:13px; }.crm-readback > div { display:grid; gap:4px; padding:10px; border:1px solid #e5ebf1; border-radius:8px; }.crm-readback strong { font-size:14px; }.crm-readback .full { grid-column:1/-1; }.crm-readback pre { margin:0; white-space:pre-wrap; color:#334155; font-size:12px; }
    .event-list { display:grid; gap:7px; max-height:220px; overflow:auto; }.event { display:flex; gap:10px; padding:9px; border-radius:7px; background:#f7fafc; font-size:12px; }.event code { flex:0 0 auto; color:#6941a5; }.event span { color:#53616d; overflow-wrap:anywhere; }
    @media (max-width:950px) { .topbar { align-items:flex-start; flex-direction:column; }.top-actions { justify-content:flex-start; }.panel,.customer-panel,.assistant-panel,.approval-panel,.crm-panel,.audit-panel { grid-column:span 12; }.telemetry { grid-template-columns:repeat(2,1fr); }.answer-row { grid-template-columns:1fr 1fr; }.answer-row small { text-align:left; grid-column:1/-1; }.policy-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div id="app"><div class="notice">正在载入销售工作台…</div></div>
  <script src="/app.js"></script>
</body>
</html>
